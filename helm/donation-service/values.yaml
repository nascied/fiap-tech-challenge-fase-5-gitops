namespace: fiap-tc-f5
image:
  # Conta AWS Academy ativa nesta sessão (811944052857) — o valor anterior
  # (170845796237) era resíduo de uma sessão Academy anterior (conta trocada
  # entre sessões), desalinhado do que o Deployment real já usava.
  repository: "811944052857.dkr.ecr.us-east-1.amazonaws.com/fiap-tc-f5-donation-reg"
  # Rebuild com o fix de otelhttp v0.55.0 -> v0.62.0 + go 1.22 -> 1.23 (métrica
  # http_server_request_duration_seconds agora é emitida de verdade — ver
  # CLAUDE.md, seção "donation-service — métrica nova nunca chega").
  tag: f9a8f49-otelfix
replicas: 1
port: 8082
# Tier 0 (Hot Path) no DRP — ver docs/drp/DRP.md do repo de infra. Requests/limits
# mantidos iguais aos demais serviços por ora; ajustar com base em métrica real de
# CPU/memória assim que o cluster estiver rodando (requisito de Rightsizing do hackathon).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
probe:
  path: /health
configMap:
  PORT: "8082"
  AWS_REGION: "us-east-1"
  # Observabilidade (OpenTelemetry -> otel-collector -> Datadog/Prometheus/Loki).
  # Go: presença/ausência de OTEL_EXPORTER_OTLP_ENDPOINT já liga/desliga o
  # tracing — não existe um TRACES_EXPORTER separado como nos serviços Python.
  # Não é segredo (é só um endpoint interno do cluster), por isso fica no
  # ConfigMap, não no Secret. Aponta pro otel-collector (repo observability),
  # não direto pro Datadog Agent — é o Collector quem roteia: traces->Datadog,
  # métricas->Prometheus, logs->Loki (mesmo padrão já usado no config.env do
  # repo services; estava desalinhado aqui até esta correção).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  # A partir do otelhttp v0.62.0 (ver go.mod do donation-service), o histograma
  # http.server.request.duration (convenção nova, consultada pelos dashboards
  # SRE) passou a ser emitido por padrão, sem depender desta variável — v0.54.0
  # a v0.61.0 tinham a variável mas nunca implementaram a métrica nova de fato
  # (só as trace attributes). Hoje esta variável só decide se a métrica ANTIGA
  # também é emitida em paralelo ("http/dup") — não usamos esse valor, então só
  # a nova é emitida.
  OTEL_SEMCONV_STABILITY_OPT_IN: "http"
# DATABASE_URL e AWS_SQS_URL vêm de um Secret nativo do Kubernetes chamado
# donation-service-secret, criado DIRETO pelo Terraform (module.k8s_secrets,
# repo infra) — não pelo Helm/CSI Driver. Motivo: o provider AWS do Secrets
# Store CSI Driver exige uma IAM role associada ao ServiceAccount (IRSA ou
# EKS Pod Identity) pra sincronizar do Secrets Manager em runtime, e nenhuma
# das duas opções funciona nesta conta Academy — testado de verdade (IRSA
# exigiria criar role nova, proibido; Pod Identity com a LabRole existente
# esbarra num deny explícito numa policy própria da conta pra editar a trust
# policy dela). Ver comentário completo em
# iac/terraform/modules/k8s-secrets/main.tf e o CLAUDE.md.
#
# externalSecret != awsSecrets (removido, CSI Driver não é mais usado neste
# chart): o Deployment só REFERENCIA um Secret que já existe (criado por fora
# do Helm release) — sem ServiceAccount, sem SecretProviderClass, sem volume
# CSI. secret: {} continua vazio (não tem segredo literal gerenciado pelo
# Helm).
#
# Sem credenciais AWS estáticas aqui (removidas numa sessão posterior):
# confirmado empiricamente que a chamada real ao SQS funciona via cadeia
# padrão de credenciais do SDK (IMDS -> instance profile do node -> LabRole),
# sem nenhuma credencial explícita — mesmo caminho que o Velero já usa.
secret: {}
externalSecret:
  enabled: true
  keys:
    - DATABASE_URL
    - AWS_SQS_URL
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: 80
ingress:
  enabled: true
  className: nginx
  annotations: {}
  paths:
    - /donations
dbInit:
  enabled: true
  image: postgres:16-alpine
