{{- if .Values.awsSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Hook, não recurso normal: o Job {{ .Chart.Name }}-db-init (hook
    # pre-install/pre-upgrade, weight -5) referencia serviceAccountName:
    # {{ .Chart.Name }} — sem isso, o Job tenta criar o pod ANTES deste
    # ServiceAccount existir (hooks rodam antes dos recursos normais do
    # release) e falha com "serviceaccount not found" (bug real, encontrado
    # rodando contra o cluster). Weight -7: antes do ConfigMap do SQL (-6) e
    # do Job (-5). Sem hook-delete-policy de propósito — precisa sobreviver à
    # fase de hooks e continuar existindo pro Deployment (recurso normal) usar
    # depois.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-7"
  # IRSA (eks.amazonaws.com/role-arn) não é usado de propósito: a conta AWS
  # Academy não permite criar IAM role própria, e a LabRole (única role
  # reutilizável) não tem "pods.eks.amazonaws.com" na trust policy — testado
  # de verdade tentando criar uma EKS Pod Identity Association apontando pra
  # ela, erro real: "Trust policy of the role provided is invalid". Ou seja,
  # nem IRSA nem Pod Identity funcionam nesta conta pro provider AWS do
  # Secrets Store CSI Driver — CONFIRMADO QUE ISSO NÃO CAI PRO LabRole/IMDS
  # sozinho (diferente do Velero/SDK das apps): o provider exige role
  # associada ao ServiceAccount e falha com "An IAM role must be associated
  # with service account X" sem ela. Pendência real, sem fix ainda.
{{- end }}
