namespace: fiap-tc-f5
image:
  # Placeholder — substituir pela URL real do output aws_ecr_repository_repository_url
  # do module.ecr (iac/terraform), ou por uma pipeline de CD que o preencha automaticamente.
  repository: "811944052857.dkr.ecr.us-east-1.amazonaws.com/fiap-tc-f5-volunteer-reg"
  tag: a4c7520
replicas: 1
port: 8083
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
probe:
  path: /health
configMap:
  PORT: "8083"
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "SolidaryTechVolunteers"
  # Observabilidade (OpenTelemetry -> otel-collector -> Datadog/Prometheus/Loki).
  # Ver README do repo de services, seção "Observabilidade". Ligado numa sessão
  # posterior — Datadog já validado recebendo trace real do donation-service
  # (API key real confirmada via /api/v1/validate), otel-collector com o
  # Service renomeado (bug real corrigido, ver CLAUDE.md) — habilitando aqui
  # também pra APM/dashboards SRE cobrirem os 3 serviços, não só o Tier 0.
  OTEL_SERVICE_NAME: "volunteer-service"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  # Sem isso, a instrumentação WSGI/Flask emite só a convenção antiga
  # (http.server.duration) — os dashboards SRE consultam a nova
  # (http_server_request_duration_seconds_count).
  OTEL_SEMCONV_STABILITY_OPT_IN: "http"
  # Não é segredo (é só um endpoint interno do cluster), por isso fica no
  # ConfigMap, não no Secret. Aponta pro otel-collector (repo observability),
  # não direto pro Datadog Agent — estava desalinhado com o config.env do
  # repo services até esta correção.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
# Sem Secrets Manager/CSI Driver neste serviço (removido numa sessão
# posterior): as credenciais AWS estáticas que vinham de lá nunca foram
# necessárias — confirmado empiricamente que a chamada real ao DynamoDB
# funciona via cadeia padrão de credenciais do SDK (IMDS -> instance profile
# do node -> LabRole), sem nenhuma credencial explícita. Sem esse secret não
# sobra nada que precise vir do Secrets Manager (AWS_REGION/AWS_DYNAMODB_TABLE
# já vêm do ConfigMap acima) — o serviço não precisa mais de ServiceAccount,
# CSI Driver nem IRSA/Pod Identity. Isso também contorna de vez uma limitação
# real da conta AWS Academy: o provider AWS do Secrets Store CSI Driver exige
# uma IAM role associada ao ServiceAccount (IRSA ou EKS Pod Identity) — e a
# LabRole não tem "pods.eks.amazonaws.com" na trust policy, então nenhuma das
# duas opções funciona nesta conta (confirmado tentando criar a associação de
# verdade: "Trust policy of the role provided is invalid").
secret: {}
awsSecrets:
  enabled: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: 80
ingress:
  enabled: true
  className: nginx
  annotations: {}
  paths:
    - /volunteers
