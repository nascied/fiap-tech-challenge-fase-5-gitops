{{- if .Values.awsSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Chart.Name }}-aws-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.awsSecrets.secretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range .Values.awsSecrets.keys }}
          - path: "{{ . }}"
            objectAlias: "{{ . }}"
          {{- end }}
  # Sincroniza o valor lido do Secrets Manager para um Secret nativo do
  # Kubernetes — assim o Deployment continua consumindo via secretKeyRef
  # normalmente, sem precisar ler o volume CSI montado diretamente.
  secretObjects:
    - secretName: {{ .Chart.Name }}-secret
      type: Opaque
      data:
        {{- range .Values.awsSecrets.keys }}
        - objectName: "{{ . }}"
          key: "{{ . }}"
        {{- end }}
{{- end }}
