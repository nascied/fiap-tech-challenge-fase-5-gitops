namespace: fiap-tc-f5
image:
  # Placeholder — substituir pela URL real do output aws_ecr_repository_repository_url
  # do module.ecr (iac/terraform), ou por uma pipeline de CD que o preencha automaticamente.
  repository: "811944052857.dkr.ecr.us-east-1.amazonaws.com/fiap-tc-f5-ngo-reg"
  tag: a4c7520
replicas: 1
port: 8081
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
probe:
  path: /health
configMap:
  PORT: "8081"
  # Observabilidade (OpenTelemetry -> otel-collector -> Datadog/Prometheus/Loki).
  # Ver README do repo de services, seção "Observabilidade". Ligado numa sessão
  # posterior — Datadog já validado recebendo trace real do donation-service
  # (API key real confirmada via /api/v1/validate), otel-collector com o
  # Service renomeado (bug real corrigido, ver CLAUDE.md) — habilitando aqui
  # também pra APM/dashboards SRE cobrirem os 3 serviços, não só o Tier 0.
  OTEL_SERVICE_NAME: "ngo-service"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  # Sem isso, a instrumentação WSGI/Flask emite só a convenção antiga
  # (http.server.duration) — os dashboards SRE consultam a nova
  # (http_server_request_duration_seconds_count).
  OTEL_SEMCONV_STABILITY_OPT_IN: "http"
  # Não é segredo (é só um endpoint interno do cluster), por isso fica no
  # ConfigMap, não no Secret — mesmo critério do donation-service/volunteer-service.
  # Aponta pro otel-collector (repo observability), não direto pro Datadog Agent
  # — estava desalinhado com o config.env do repo services até esta correção.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
# DATABASE_URL vem de um Secret nativo do Kubernetes chamado ngo-service-secret,
# criado DIRETO pelo Terraform (module.k8s_secrets, repo infra) — não pelo
# Helm/CSI Driver. Mesmo motivo do donation-service (ver values.yaml de lá,
# ou iac/terraform/modules/k8s-secrets/main.tf/CLAUDE.md pro detalhe
# completo): o provider AWS do Secrets Store CSI Driver exige IRSA/EKS Pod
# Identity, e nenhuma das duas funciona nesta conta Academy. Antes disso era
# um placeholder literal fixo (`CHANGE_ME`) sem nenhum mecanismo automatizado
# de sincronização pós-`terraform apply`.
secret: {}
externalSecret:
  enabled: true
  keys:
    - DATABASE_URL
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: 80
ingress:
  enabled: true
  className: nginx
  annotations: {}
  # Rotas reais do serviço — sem prefixo/rewrite, já que os paths do Flask já são
  # curtos e sem colisão entre serviços. /health fica de fora de propósito: não é
  # feito pra tráfego externo, só pra liveness/readiness probe (acesso direto ao Pod).
  paths:
    - /ngos
dbInit:
  enabled: true
  image: postgres:16-alpine
