{{- if .Values.awsSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  # Sem anotação IRSA de propósito: a conta AWS Academy não permite criar IAM
  # role própria. O add-on aws-secrets-store-csi-driver-provider (module.eks
  # no repo de infra) cai para a identidade ambiente do node (LabRole, mesma
  # role do node group do EKS) via IMDS — igual ao Velero (module.velero).
  # Numa conta AWS real, bastaria anotar este ServiceAccount com
  # eks.amazonaws.com/role-arn (IRSA) ou usar EKS Pod Identity, sem mudar
  # mais nada no resto do chart.
{{- end }}
