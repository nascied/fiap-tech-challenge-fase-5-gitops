{{- if .Values.awsSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Chart.Name }}-aws-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    # Hook, mesma razão do serviceaccount.yaml: o Job {{ .Chart.Name }}-db-init
    # (hook, weight -5) monta um volume CSI referenciando este
    # SecretProviderClass — sem ser hook também, ele só existiria na fase de
    # Sync normal (depois dos hooks), e o Job falha com "SecretProviderClass
    # ... not found" (bug real, encontrado rodando contra o cluster, mesma
    # classe do bug do ServiceAccount). Mesmo weight do ServiceAccount (-7,
    # independentes entre si) — os dois só precisam existir antes do Job (-5).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-7"
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.awsSecrets.secretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range .Values.awsSecrets.keys }}
          - path: "{{ . }}"
            objectAlias: "{{ . }}"
          {{- end }}
  # Sincroniza o valor lido do Secrets Manager para um Secret nativo do
  # Kubernetes — assim o Deployment continua consumindo via secretKeyRef
  # normalmente, sem precisar ler o volume CSI montado diretamente.
  secretObjects:
    - secretName: {{ .Chart.Name }}-secret
      type: Opaque
      data:
        {{- range .Values.awsSecrets.keys }}
        - objectName: "{{ . }}"
          key: "{{ . }}"
        {{- end }}
{{- end }}
